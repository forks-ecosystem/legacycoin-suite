name: legacycoin-suite
services:
  suite:
    container_name: legacycoin-suite
    build: .
    restart: unless-stopped
    network_mode: host
    env_file: .env
    environment:
      WALLET: ${WALLET}
      POOL: ${POOL}
      WORKER: ${WORKER:-cpu}
      WORKERS: ${WORKERS:-4}
    volumes:
      - /etc/forkex/legacycoin-suite/config.json:/app/config.json:ro
      - /app/legacycoin-suite/config/admin.json:/app/config/admin.json
      - /app/legacybtc-pool/_git_LegacyCore.sh:/app/_git_LegacyCore.sh:ro
      - /var/lib/forkex/legacycoin-suite:/app/tmp
      - /var/log/forkex/legacycoin-suite:/app/logs
