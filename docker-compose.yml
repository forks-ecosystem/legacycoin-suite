name: legacycoin-suite
services:
  suite:
    container_name: legacycoin-suite
    build: .
    restart: unless-stopped
    network_mode: host
    volumes:
      - /app/legacycoin-suite/config:/app/config
      - /app/legacybtc-pool/_git_LegacyCore.sh:/app/_git_LegacyCore.sh:ro
      - /var/lib/forkex/legacycoin-suite:/app/tmp
      - /app/legacycoin-suite/db:/app/db
      - /var/log/forkex/legacycoin-suite:/app/logs
